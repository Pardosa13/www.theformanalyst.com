<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse + Jockey Art Lab</title>
<!--
  Isolation harness for the vector horse in static/js/race-horse-art.js.

  This page is deliberately standalone: no Flask route, no login, no data. Open
  it at /static/race-horse-lab.html to tune the artwork, the gait keyframes and
  the silk patterns against a blank background before any of it is wired into
  the race animation. Nothing on the site loads this file.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0d13; color: #f0f0f5;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  p.sub { margin: 0; color: #9090a8; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
              padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  label { font-size: 12px; color: #9090a8; display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 160px; }
  button { background: #18181f; color: #f0f0f5; border: 1px solid rgba(255,255,255,0.14);
           border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #24242e; }
  .hero { display: flex; justify-content: center; padding: 8px 0 0; }
  .hero svg { background:
      linear-gradient(to bottom, #14141c 0%, #14141c 88%, #1d2a1d 88%, #1d2a1d 100%);
      border-radius: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 10px; padding: 20px 24px 48px; }
  .cell { background: #14141c; border: 1px solid rgba(255,255,255,0.07);
          border-radius: 10px; padding: 8px; text-align: center; }
  .cell svg { display: block; width: 100%; height: auto; }
  .cell span { font-size: 11px; color: #9090a8; }
</style>
</head>
<body>
<header>
  <h1>Horse + Jockey Art Lab</h1>
  <p class="sub">One horse, blank background — for tuning the shape, the gait and the silk patterns in isolation.</p>
</header>

<div class="controls">
  <label>Gait <input id="phase" type="range" min="0" max="1000" value="0"></label>
  <label>Speed <input id="speed" type="range" min="0" max="300" value="120"></label>
  <button id="playPause">Pause</button>
  <label><input id="freeze" type="checkbox"> Step the 4 keyframes only</label>
  <label>Number <input id="num" type="number" value="7" min="1" max="24" style="width:56px"></label>
  <button id="reroll">Reroll silk</button>
</div>

<div class="hero"><svg id="hero" width="720" height="475" viewBox="0 0 100 66"></svg></div>
<div class="grid" id="grid"></div>

<script src="/static/js/race-horse-art.js"></script>
<script>
(function () {
  var PATTERNS = ['solid', 'stripes', 'hoops', 'halved', 'quartered', 'spots', 'sash', 'chevron'];
  var COLOURS = ['#e23b3b', '#2f6fd0', '#f2c53d', '#2fa860', '#8b4fc4', '#ef7f2e',
                 '#25b4c4', '#d94f9a', '#5a6b8c', '#1f4f8f', '#c9973a', '#39a06a'];
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  var hero = document.getElementById('hero');
  var horse = null;

  function buildHero() {
    if (horse) horse.destroy();
    horse = RaceHorseArt.create({
      seedName: 'Lab Horse ' + Math.random(),
      number: document.getElementById('num').value,
      silk: { fallback: { primary: pick(COLOURS), secondary: pick(COLOURS),
                          cap: pick(COLOURS), pattern: pick(PATTERNS) } }
    });
    hero.appendChild(horse.node);
  }

  // Every pattern, side by side, so a change to buildSilkPaint can be eyeballed
  // across all of them at once.
  var grid = document.getElementById('grid');
  var samples = [];
  PATTERNS.forEach(function (pattern, i) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 66');
    cell.appendChild(svg);
    var caption = document.createElement('span');
    caption.textContent = pattern;
    cell.appendChild(caption);
    grid.appendChild(cell);
    var sample = RaceHorseArt.create({
      seedName: 'sample-' + pattern, number: i + 1,
      silk: { fallback: { primary: COLOURS[i % COLOURS.length],
                          secondary: COLOURS[(i + 5) % COLOURS.length],
                          cap: COLOURS[(i + 2) % COLOURS.length], pattern: pattern } }
    });
    svg.appendChild(sample.node);
    samples.push(sample);
  });

  var playing = true, phase = 0, last = performance.now();
  var phaseInput = document.getElementById('phase');
  var speedInput = document.getElementById('speed');
  var freeze = document.getElementById('freeze');

  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      phase = (phase + dt * (speedInput.value / 100) * 2.2) % 1;
      phaseInput.value = Math.round(phase * 1000);
    } else {
      phase = phaseInput.value / 1000;
    }
    // Snapping to quarters shows the four authored keyframes on their own.
    var applied = freeze.checked ? Math.floor(phase * 4) / 4 : phase;
    horse.setGait(applied);
    for (var i = 0; i < samples.length; i++) samples[i].setGait(applied + i * 0.1);
    requestAnimationFrame(frame);
  }

  document.getElementById('playPause').addEventListener('click', function () {
    playing = !playing; this.textContent = playing ? 'Pause' : 'Play';
  });
  phaseInput.addEventListener('input', function () { playing = false;
    document.getElementById('playPause').textContent = 'Play'; });
  document.getElementById('reroll').addEventListener('click', buildHero);
  document.getElementById('num').addEventListener('input', buildHero);

  buildHero();
  requestAnimationFrame(frame);
}());
</script>
</body>
</html>
