name: Live Odds Ingest

# WHY THIS FILE EXISTS
# --------------------
# Meeting 1962 scored zero picks because live_odds_snapshots did not exist on
# the production database. The table was never missing by accident: NOTHING
# scheduled odds_ingest.py, and odds_ingest.py is what creates the table
# (ensure_tables(), on the way into every run — there is no Alembic migration
# for it and no other owner). A job that never runs creates nothing and writes
# nothing, so ml_predict.py had neither a table to read nor rows to find.
#
# Scheduling it was necessary but NOT sufficient, and the first run proved it:
# run #1 (2026-08-30) died in under a second on `DATABASE_URL not set` because
# the repository has no DATABASE_URL secret. `secrets.DATABASE_URL` renders as
# an empty string when the secret is absent, so the job starts, installs 300MB
# of wheels, and only then exits 1 — which reads like a broken job rather than
# missing configuration. Every other DB-touching workflow here (mma-sync.yml,
# fix-2026-player-ids.yml) has been failing the same way, unnoticed.
#
# So the table does not exist yet and no snapshot has ever been written. Until
# the DATABASE_URL repository secret is set, this workflow cannot create it and
# ml_predict.py's market blend will keep reporting priced=0. The preflight step
# below states exactly that, up front, instead of burying it.
#
# ONE JOB, MANY PASSES
# --------------------
# A price is only worth reading while it is still the market (ml_predict drops
# a snapshot older than ML_LIVE_ODDS_MAX_AGE_SECONDS, 15 minutes by default),
# so this wants to poll every few minutes. GitHub's scheduler cannot be relied
# on for that — the minimum is 5 minutes and runs are routinely delayed under
# load — and each firing pays a checkout and a pip install before it does any
# work. So the cron fires every 15 minutes and each run holds its own
# 3-minute poll loop for ~13 minutes: real 3-minute resolution, at one
# scheduler firing per quarter hour.
#
# If a long-running Railway worker service is available, `python odds_ingest.py
# --loop` there is strictly better (no per-run startup cost, no scheduler
# delay) and this workflow can be disabled. See DEPLOYMENT.md.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Meeting date to poll (YYYY-MM-DD). Blank = today, Melbourne time.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Two overlapping pollers would double every insert into an insert-only
  # table, which is not corruption but is noise the price path has to be read
  # through later. A delayed run is skipped rather than queued: its window has
  # already passed and the next one is minutes away.
  group: odds-ingest
  cancel-in-progress: false

jobs:
  odds-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Before the checkout and the ~45s dependency install, so a missing
      # secret is the first thing in the log rather than the last. An absent
      # secret is indistinguishable from an empty one here, and both mean the
      # poll cannot run.
      - name: Verify DATABASE_URL secret is present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=DATABASE_URL secret is not set::This workflow cannot \
          poll odds without it. odds_ingest.py owns live_odds_snapshots and creates \
          it on the way in, so while this secret is missing the table does not exist, \
          no snapshots are written, and ml_predict.py's ML_LIVE_MARKET_BLEND reports \
          priced=0. Set it at Settings > Secrets and variables > Actions > New \
          repository secret, name it DATABASE_URL, and give it the same Postgres \
          connection string the Railway app uses."
            exit 1
          fi
          echo "DATABASE_URL secret is present."

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Ladbrokes and store snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python odds_ingest.py \
            --loop \
            --interval 180 \
            --duration-seconds 780 \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
