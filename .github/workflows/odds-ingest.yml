name: Live Odds Ingest

# WHY THIS FILE EXISTS
# --------------------
# Meeting 1962 scored zero picks because live_odds_snapshots did not exist on
# the production database. The table was never missing by accident: NOTHING
# scheduled odds_ingest.py, and odds_ingest.py is what creates the table
# (ensure_tables(), on the way into every run — there is no Alembic migration
# for it and no other owner). A job that never runs creates nothing and writes
# nothing, so ml_predict.py had neither a table to read nor rows to find.
#
# Scheduling it was necessary but NOT sufficient: the repository has no
# DATABASE_URL secret. `secrets.DATABASE_URL` renders as an empty string when
# the secret is absent, so without a guard the job installs 300MB of wheels
# and only then exits 1 on `DATABASE_URL not set`. Every other DB-touching
# workflow here (mma-sync.yml, fix-2026-player-ids.yml) is in the same state.
#
# A MISSING SECRET IS CONFIGURATION, NOT A BROKEN JOB
# ---------------------------------------------------
# The first attempt at this made the missing secret a hard `exit 1` on the
# theory that a loud failure gets noticed. On a */15 schedule that is 96
# identical "All jobs have failed" emails a day — 26 of them arrived overnight
# before anyone looked — and a failure that arrives 96 times a day is the one
# thing guaranteed NOT to be read. It also buries real failures: once the
# mailbox is full of this, an actual ingest bug looks like more of the same.
#
# So the run is only red when red means something:
#   - scheduled run, no secret  -> skip the poll, annotate a warning, exit 0.
#     Nothing to do and nobody to tell; the run summary carries the reason.
#   - manual run, no secret     -> exit 1. A human asked for this right now,
#     so the answer is an error in front of them, not a silent green tick.
#   - secret present            -> poll, and a genuine failure is a real email.
# Silence is not the same as unnoticed: every skipped run still writes the
# missing-secret notice and the fix into its job summary.
#
# ONE JOB, MANY PASSES
# --------------------
# A price is only worth reading while it is still the market (ml_predict drops
# a snapshot older than ML_LIVE_ODDS_MAX_AGE_SECONDS, 15 minutes by default),
# so this wants to poll every few minutes. GitHub's scheduler cannot be relied
# on for that — the minimum is 5 minutes and runs are routinely delayed under
# load — and each firing pays a checkout and a pip install before it does any
# work. So the cron fires every 15 minutes and each run holds its own
# 3-minute poll loop for ~13 minutes: real 3-minute resolution, at one
# scheduler firing per quarter hour.
#
# If a long-running Railway worker service is available, `python odds_ingest.py
# --loop` there is strictly better (no per-run startup cost, no scheduler
# delay) and this workflow can be disabled. See DEPLOYMENT.md.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Meeting date to poll (YYYY-MM-DD). Blank = today, Melbourne time.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Two overlapping pollers would double every insert into an insert-only
  # table, which is not corruption but is noise the price path has to be read
  # through later. A delayed run is skipped rather than queued: its window has
  # already passed and the next one is minutes away.
  group: odds-ingest
  cancel-in-progress: false

jobs:
  odds-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Before the checkout and the ~45s dependency install, so an unconfigured
      # repository costs seconds rather than a full environment build. An absent
      # secret is indistinguishable from an empty one here, and both mean the
      # poll cannot run.
      - name: Check DATABASE_URL secret
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret is present."
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          {
            echo "## Odds poll skipped — DATABASE_URL secret is not set"
            echo
            echo "\`odds_ingest.py\` owns \`live_odds_snapshots\` and creates it on the"
            echo "way in, so while this secret is missing the table does not exist, no"
            echo "snapshots are written, and \`ml_predict.py\`'s \`ML_LIVE_MARKET_BLEND\`"
            echo "reports \`priced=0\`. Live scoring still runs — it just scores off the"
            echo "model alone, with no market blend."
            echo
            echo "**To fix:** Settings > Secrets and variables > Actions > New repository"
            echo "secret, name it \`DATABASE_URL\`, and give it the same Postgres"
            echo "connection string the Railway app uses."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MANUAL_RUN" = "true" ]; then
            echo "::error title=DATABASE_URL secret is not set::You triggered this run \
          manually and it cannot poll odds without the secret. Set it at Settings > \
          Secrets and variables > Actions > New repository secret, name it DATABASE_URL, \
          and give it the same Postgres connection string the Railway app uses."
            exit 1
          fi

          echo "::warning title=DATABASE_URL secret is not set::Skipping the odds poll. \
          No snapshots are being written and ml_predict.py's market blend will report \
          priced=0 until the DATABASE_URL repository secret is set. Scheduled runs stay \
          green while it is missing so this does not mail out every 15 minutes; see the \
          job summary for the fix."

      - name: Checkout repo
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Poll Ladbrokes and store snapshots
        if: steps.preflight.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python odds_ingest.py \
            --loop \
            --interval 180 \
            --duration-seconds 780 \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
